<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #161614;
    color: #ecebe6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 84px;
    box-sizing: border-box;
  }
  .left { max-width: 560px; }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: #7fc3a6; margin-bottom: 26px; }
  h1 { font-size: 62px; line-height: 1.08; margin: 0 0 22px; letter-spacing: -0.025em; font-weight: 750; }
  .sub { font-size: 24px; line-height: 1.4; color: #a8a59c; margin: 0; }
  .card {
    width: 470px;
    background: #1d1d1a;
    border: 1px solid #34332f;
    border-radius: 14px;
    padding: 26px 28px;
    box-sizing: border-box;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 19px;
    line-height: 1.75;
  }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .leak { color: #e8836f; font-weight: 700; }
  .held { color: #7fc3a6; font-weight: 700; }
  .dim { color: #a8a59c; }
  .title { font-size: 17px; color: #a8a59c; margin-bottom: 10px; font-family: system-ui, sans-serif; }
  hr { border: 0; border-top: 1px solid #34332f; margin: 14px 0; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">notyours</div>
    <h1>Prove your users' data stays theirs.</h1>
    <p class="sub">Isolation tests for your own app, in real browsers. A canary token decides, not an AI.</p>
  </div>
  <div class="card">
    <div class="title">demo verdicts · kane-cli 0.10.0</div>
    <div class="row"><span>B1 Bob reads Alice's note</span><span class="leak">LEAK</span></div>
    <div class="row"><span>B2 guest</span><span class="held">HELD</span></div>
    <div class="row"><span>B3 free user, Pro export</span><span class="leak">LEAK</span></div>
    <div class="row"><span>B4 Bob sweeps the list</span><span class="held">HELD</span></div>
    <hr>
    <div class="dim">token NY-ALICE-K7Q2MZX4P3RA</div>
  </div>
</body>
</html>
