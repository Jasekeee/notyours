# CI: build, typecheck, the non-browser tests and the false-green regression tests. Mock-driven only: this workflow
# never installs or runs kane-cli, so it never spends Kane credits. The browser tests run in e2e.yml (manual).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, typecheck, test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Chrome (used by the headless-browser tests)
        run: |
          google-chrome --version || chromium --version || echo "::warning::no Chrome on PATH; browser tests will fail"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Non-browser test files only. The five browser test files (real headless Chrome) run locally with `npm test`
      # and in the E2E workflow (.github/workflows/e2e.yml, manual + nightly): on ubuntu-latest, 8 engine tests that
      # judge captured network response bodies time out (docs/STATUS.md, "CI"), so they are kept out of this badge
      # instead of being skipped or weakened.
      - name: Test, non-browser files (mocks only, no Kane runs)
        run: npm run test:unit

      # The checks that keep a verdict from going falsely green (oracle bodies and controls, the Stop hook failing
      # closed, the stale-server and restart checks, replay exit codes, guest viewers, the agent budget guard),
      # all without a browser, so they gate every push and pull request.
      - name: False-green regression tests (no browser)
        run: npm run test:false-green
